## MCPProxy — tells the mcp-auto operator to create a proxy Deployment + Service.
## Apply after the MCPUpstream is created:
##   kubectl apply -f deploy/examples/kagent/mcpproxy.yaml -n mcp-system
##
## Replace <PROXY_IMAGE> with the mcp-auto proxy image tag
## (e.g. ghcr.io/lega4e/mcp-auto:latest).

apiVersion: mcp-auto.ai/v1alpha1
kind: MCPProxy
metadata:
  name: demo-proxy
  namespace: mcp-system
spec:
  upstreamSelector:
    matchLabels:
      mcp-auto.ai/proxy: demo-proxy
  image: "<PROXY_IMAGE>"
  server:
    port: 8080
    transport:
      - streamable-http
  naming:
    separator: "__"
